ShortDescription: Choose, per Bluetooth speaker or headset, whether Windows may switch your audio to it when it connects.
Description: |-
  Windows moves your sound to a Bluetooth speaker or headset the moment it connects. NopeSpeaker
  lists your paired Bluetooth devices and lets you switch, per device, whether Windows may play
  audio on it: a switched-off device still pairs and connects, Windows just plays nothing on it.
  Each change disables or enables the device's audio nodes and asks for administrator rights (UAC).
