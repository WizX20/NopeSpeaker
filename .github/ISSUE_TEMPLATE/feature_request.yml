name: Feature request
description: Suggest an enhancement or new capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case first, the proposed solution second. Check the [roadmap in docs/design.md](https://github.com/WizX20/xBlueTooth/blob/main/docs/design.md#roadmap) first: it may already be planned.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-flight
      options:
        - label: I searched [open and closed issues](https://github.com/WizX20/xBlueTooth/issues?q=) for an existing request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation with your devices - skip the implementation for now.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working in the app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, related tools, reference implementations.
