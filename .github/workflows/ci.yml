name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly on main, the day before the Tuesday release: in a quiet week nothing else would run
  # the release token expiry check (a failed scheduled run emails the maintainer), and it shows
  # a runner image or a new SDK breaking the build.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  # A pull request shares one group, so a newer push cancels the superseded run; everything else
  # gets a group per commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (core)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the changelog fragments
        shell: pwsh
        run: ./scripts/cut-changelog.ps1 -Check

      - name: Test the core (xUnit)
        shell: pwsh
        run: dotnet test --project tests/NopeSpeaker.Core.Tests -c Release --report-xunit-trx --report-xunit-trx-filename core-test-results.trx --coverage --coverage-output-format cobertura --coverage-output core-coverage.cobertura.xml --results-directory ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            dist/core-test-results.trx
            dist/core-coverage.cobertura.xml

  pack:
    name: pack (${{ matrix.platform }})
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: pwsh
        run: ./scripts/pack.ps1 -Platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NopeSpeaker-${{ matrix.platform }}
          path: dist/NopeSpeaker-*.zip

  token-expiry:
    name: release token expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pull requests from forks carry no secrets, and neither do Dependabot's (it only gets the
    # separate Dependabot secrets): nothing to check there, and the job must not block them - a
    # skipped job counts as passed for the required check. Everything else (own branches, pushes
    # to main, the weekly run) gets the check.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    env:
      SECRET_NAME: NOPESPEAKER_RELEASE_TOKEN
      WARN_DAYS: 30
      FAIL_DAYS: 14
      ISSUE: https://github.com/WizX20/NopeSpeaker/issues/27
    steps:
      - name: Read the token's expiry from the API
        env:
          TOKEN: ${{ secrets.NOPESPEAKER_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The release commit is pushed with this fine-grained PAT (main is PR-only; GITHUB_TOKEN
          # cannot bypass the ruleset). A lapsed token breaks every release, so the token's own
          # expiry - GitHub sends it back on any call made with it - gates merges: a warning from
          # WARN_DAYS out, a failure from FAIL_DAYS out. Rotate per $ISSUE, no date to maintain.
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret $SECRET_NAME is missing - releases cannot push to main."
            exit 1
          fi
          HEADERS=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/user)
          STATUS=$(printf '%s\n' "$HEADERS" | head -1 | tr -d '\r')
          case "$STATUS" in
            *" 200"*) ;;
            *) echo "::error::$SECRET_NAME was rejected by the API ($STATUS) - expired or revoked? Rotate it: $ISSUE"; exit 1 ;;
          esac
          EXPIRES=$(printf '%s\n' "$HEADERS" | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$EXPIRES" ]; then
            echo "::error::$SECRET_NAME has no expiration header - is it a fine-grained token with an expiry?"
            exit 1
          fi
          DAYS=$(( ( $(date -u -d "$EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "$SECRET_NAME expires on $EXPIRES - $DAYS day(s) left"
          echo "### Release token" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SECRET_NAME\` expires on **$EXPIRES** ($DAYS days left)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DAYS" -le "$FAIL_DAYS" ]; then
            echo "::error::$SECRET_NAME expires in $DAYS day(s) ($EXPIRES). Rotate it before merging anything else: $ISSUE"
            exit 1
          fi
          if [ "$DAYS" -le "$WARN_DAYS" ]; then
            echo "::warning::$SECRET_NAME expires in $DAYS day(s) ($EXPIRES). Rotate it soon: $ISSUE"
          fi
