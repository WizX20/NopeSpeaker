name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request shares one group, so a newer push cancels the superseded run; everything else
  # gets a group per commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (core)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test the core (xUnit)
        shell: pwsh
        run: dotnet test --project tests/xBlueTooth.Core.Tests -c Release --report-xunit-trx --report-xunit-trx-filename core-test-results.trx --coverage --coverage-output-format cobertura --coverage-output core-coverage.cobertura.xml --results-directory ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            dist/core-test-results.trx
            dist/core-coverage.cobertura.xml

  pack:
    name: pack (${{ matrix.platform }})
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: pwsh
        run: ./scripts/pack.ps1 -Platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xBlueTooth-${{ matrix.platform }}
          path: dist/xBlueTooth-*.zip
